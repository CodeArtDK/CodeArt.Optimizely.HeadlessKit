name: NuGet Package

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  package:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/CodeArt.Optimizely.HeadlessKit.sln

      - name: Build
        run: dotnet build src/CodeArt.Optimizely.HeadlessKit.sln -c Release --no-restore

      - name: Test
        run: dotnet test test/CodeArt.Optimizely.HeadlessKit.Tests/CodeArt.Optimizely.HeadlessKit.Tests.csproj -c Release --no-build --logger trx --results-directory ./test-results

      - name: Pack
        run: dotnet pack src/CodeArt.Optimizely.HeadlessKit/CodeArt.Optimizely.HeadlessKit.csproj -c Release --no-build --version-suffix ${{ github.run_number }} -o ./packages

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./packages/*.nupkg
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/*.trx
